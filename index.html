<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مصروف البيت</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f4;--surface:#fff;--ink:#1d2b36;--muted:#5d6e7a;--line:#d5dde2;--brand:#0f6e6e;--brand-ink:#fff;--danger:#b3372f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13202a;--surface:#1b2c38;--ink:#e8eef2;--muted:#9fb0bb;--line:#2c4252;--brand:#3fb5b0;--brand-ink:#0d1a22;--danger:#ef8a82}}
:root[data-theme="dark"]{--bg:#13202a;--surface:#1b2c38;--ink:#e8eef2;--muted:#9fb0bb;--line:#2c4252;--brand:#3fb5b0;--brand-ink:#0d1a22;--danger:#ef8a82}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.month button{background:none;border:1px solid var(--line);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.month b{font-size:16px;font-weight:600}
.total{padding:8px 0 4px}
.total small{color:var(--muted);font-size:14px}
.total .n{font-size:48px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.total .n span{font-size:18px;font-weight:600;color:var(--muted);margin-inline-start:6px}
.strip{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:12px 0}
.strip i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-bottom:16px}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px}
.legend b{color:var(--ink);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 10px;font-weight:800}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.amount{font-size:22px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.primary{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);font:inherit;font-size:17px;font-weight:800;cursor:pointer}
.err{color:var(--danger);font-size:13px;min-height:20px;margin-top:6px}
.who{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:15px}
.who div:nth-child(even){font-weight:600}
.day{font-size:13px;color:var(--muted);margin:14px 0 6px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:15px}
.item .t small{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.item .a{font-weight:800}
.del{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:15px}
.add-m{display:flex;gap:8px;margin-top:10px}
.add-m button{flex:none;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;display:none;z-index:20;overflow-wrap:anywhere}#toast.show{display:block}
</style>
</head>
<body>
<main>
  <section class="panel" id="login" hidden>
    <h2>مصروف البيت</h2>
    <div class="empty" id="lmsg">سجّل دخولك بحساب Google عشان تشوف مصروفات الأسرة وتسجّل.</div>
    <button class="primary" id="gl" type="button">تسجيل الدخول بحساب Google</button>
  </section>
  <section class="panel" id="setup" hidden>
    <h2>أهلاً بيك 👋</h2>
    <label for="sname">اسمك</label>
    <input id="sname" maxlength="20">
    <button class="primary" id="mk" type="button">إنشاء بيت جديد</button>
    <label for="scode" style="margin-top:20px">أو انضم لبيت أسرتك بالكود</label>
    <input id="scode" maxlength="8" placeholder="مثال: K7M2QX9A" dir="ltr">
    <button class="primary" id="jn" type="button">انضمام بالكود</button>
    <div class="err" id="smsg" role="alert"></div>
  </section>
  <div id="app" hidden>
  <div class="month">
    <button id="next" aria-label="الشهر التالي">›</button>
    <b id="mlabel"></b>
    <button id="prev" aria-label="الشهر السابق">‹</button>
  </div>
  <div class="total"><small>إجمالي مصروف الشهر</small><div class="n"><span id="sum">0</span><span>جنيه</span></div></div>
  <div class="strip" id="strip"></div>
  <div class="legend" id="legend"></div>

  <section class="panel">
    <h2>سجّل مصروف</h2>
    <label for="amt">المبلغ (جنيه)</label>
    <input id="amt" class="amount" type="number" inputmode="decimal" min="0" step="any" placeholder="0">
    <label>الفئة</label>
    <div class="chips" id="cats"></div>
    <label>مين صرف؟</label>
    <div class="chips" id="members"></div>
    <div class="add-m"><input id="newm" placeholder="اسم فرد جديد" maxlength="20"><button id="addm" type="button">إضافة</button></div>
    <div class="row">
      <div><label for="note">ملاحظة</label><input id="note" maxlength="60" placeholder="مثلاً: سوبرماركت"></div>
      <div><label for="date">التاريخ</label><input id="date" type="date"></div>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="primary" id="save" type="button">حفظ المصروف</button>
  </section>

  <section class="panel" id="whop" hidden>
    <h2>مصروف كل فرد</h2>
    <div class="who" id="who"></div>
  </section>

  <section class="panel">
    <h2>مصروفات الشهر</h2>
    <div id="list"></div>
  </section>
  <section class="panel"><h2>كود الأسرة</h2><div id="hcode" style="font-size:26px;font-weight:800;letter-spacing:3px;direction:ltr;text-align:center"></div><div class="empty" style="padding:6px 0 0;font-size:13px">ابعت الكود ده لأفراد أسرتك عشان يدخلوا نفس البيت من خانة "الانضمام بالكود". ما تبعتوش لحد غريب.</div></section>
  <div style="text-align:center;margin-top:8px"><button class="chip" id="out" type="button">تسجيل خروج</button></div>
  </div>
</main>
<div id="toast" role="status"></div>
<script>
var CATS=[["أكل وشرب","#0f6e6e"],["مواصلات","#3b6fb6"],["فواتير","#e8a33d"],["صحة","#c4527a"],["تعليم","#7b5ea7"],["ملابس","#d9743b"],["ترفيه","#4f9d5d"],["أخرى","#7f8c95"]];
var S={expenses:[],members:[]},DB=null,canWrite=true;
var tt;function fail(e){var t=$("toast");t.textContent="تعذّر تنفيذ العملية ("+((e&&e.code)||"خطأ")+(e&&e.message?": "+e.message:"")+")";t.className="show";clearTimeout(tt);tt=setTimeout(function(){t.className=""},8000)}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return Number(n).toLocaleString("ar-EG",{maximumFractionDigits:2})}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var view=today().slice(0,7),cat=0,who="";try{who=localStorage.getItem("who")||""}catch(e){}
$("date").value=today();

function shift(n){var a=view.split("-"),d=new Date(+a[0],+a[1]-1+n,1);view=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");render()}
$("prev").onclick=function(){shift(-1)};$("next").onclick=function(){shift(1)};

function chips(){if(S.members.length&&S.members.indexOf(who)<0)who=S.members[0];
  $("cats").innerHTML=CATS.map(function(c,i){return '<button type="button" class="chip" data-c="'+i+'" aria-pressed="'+(i===cat)+'">'+c[0]+'</button>'}).join("");
  $("members").innerHTML=S.members.map(function(m,i){return '<button type="button" class="chip" data-m="'+i+'" aria-pressed="'+(m===who)+'">'+esc(m)+'</button>'}).join("");
}
$("cats").onclick=function(e){var b=e.target.closest("[data-c]");if(b){cat=+b.dataset.c;chips()}};
$("members").onclick=function(e){var b=e.target.closest("[data-m]");if(b){who=S.members[+b.dataset.m];try{localStorage.setItem("who",who)}catch(e){}chips()}};
$("addm").onclick=function(){var v=$("newm").value.trim();if(v&&S.members.indexOf(v)<0&&DB){who=v;try{localStorage.setItem("who",v)}catch(e){}$("newm").value="";DB.doc("meta/members").set({list:S.members.concat([v])}).catch(fail)}};

$("save").onclick=function(){
  var a=parseFloat($("amt").value);
  if(!(a>0)){$("err").textContent="اكتب مبلغ أكبر من صفر.";return}
  if(!$("date").value){$("err").textContent="اختار التاريخ.";return}
  $("err").textContent="";
  if(!DB){$("err").textContent="سجّل دخولك الأول علشان تقدر تسجّل مصروف.";return}
  if(!canWrite){$("err").textContent="مش مسموح لك بالتسجيل. اطلب من صاحب التطبيق يضيفك كمشارك.";return}
  if(!who){$("err").textContent="ضيف اسمك الأول من خانة اسم فرد جديد.";return}
  DB.collection("expenses").add({amount:a,cat:cat,who:who,note:$("note").value.trim(),date:$("date").value,at:Date.now()}).catch(fail);
  view=$("date").value.slice(0,7);
  $("amt").value="";$("note").value="";$("amt").focus();render();
};
function note(m){var t=$("toast");t.textContent=m;t.className="show";clearTimeout(tt);tt=setTimeout(function(){t.className=""},4000)}
$("list").onclick=function(e){var b=e.target.closest("[data-d]");if(!b)return;if(!DB){fail({code:"not_signed_in"});return}
  var id=b.dataset.d;S.expenses=S.expenses.filter(function(x){return x.id!==id});render();
  try{DB.doc("expenses/"+id).delete().then(function(){note("اتمسح المصروف")},function(er){fail(er);DB.collection("expenses").get().then(function(s){S.expenses=s.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x});render()})})}catch(err){fail(err)}};

function render(){
  var a=view.split("-");
  $("mlabel").textContent=new Date(+a[0],+a[1]-1,1).toLocaleDateString("ar-EG",{month:"long",year:"numeric"});
  var ex=S.expenses.filter(function(x){return x.date.slice(0,7)===view}).sort(function(x,y){return y.date.localeCompare(x.date)||(y.at||0)-(x.at||0)});
  var sum=ex.reduce(function(s,x){return s+x.amount},0);
  $("sum").textContent=fmt(sum);
  var byCat=CATS.map(function(){return 0});ex.forEach(function(x){byCat[x.cat]+=x.amount});
  $("strip").innerHTML=sum?CATS.map(function(c,i){return byCat[i]?'<i style="width:'+(byCat[i]/sum*100)+'%;background:'+c[1]+'"></i>':""}).join(""):"";
  $("legend").innerHTML=CATS.map(function(c,i){return byCat[i]?'<span><i style="background:'+c[1]+'"></i>'+c[0]+' <b>'+fmt(byCat[i])+'</b></span>':""}).join("");
  var byWho={};ex.forEach(function(x){byWho[x.who]=(byWho[x.who]||0)+x.amount});
  var names=Object.keys(byWho);
  $("whop").hidden=names.length<1;
  $("who").innerHTML=names.map(function(n){return '<div>'+esc(n)+'</div><div>'+fmt(byWho[n])+' جنيه</div>'}).join("");
  if(!ex.length){$("list").innerHTML='<div class="empty">مفيش مصروفات في الشهر ده. سجّل أول مصروف من فوق.</div>';return}
  var h="",last="",dayTotals={};
  ex.forEach(function(x){dayTotals[x.date]=(dayTotals[x.date]||0)+x.amount});
  ex.forEach(function(x){
    if(x.date!==last){last=x.date;var p=x.date.split("-");
      h+='<div class="day"><span>'+new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("ar-EG",{weekday:"long",day:"numeric",month:"long"})+'</span><span>'+fmt(dayTotals[x.date])+' جنيه</span></div>'}
    h+='<div class="item"><span class="dot" style="background:'+CATS[x.cat][1]+'"></span><div class="t"><b>'+CATS[x.cat][0]+(x.note?" - "+esc(x.note):"")+'</b><small>'+esc(x.who)+'</small></div><div class="a">'+fmt(x.amount)+'</div><button class="del" data-d="'+x.id+'" aria-label="حذف المصروف">×</button></div>'});
  $("list").innerHTML=h;
}
chips();render();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot,getDocs,getDoc,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCX3g7SFlEoTUmVQxv7HOkjOQMXfQ3rSGE",authDomain:"test-1-fbaf8.firebaseapp.com",projectId:"test-1-fbaf8",appId:"1:723355751794:web:9114d0ba03db54b2a339eb"};

const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app);
const ALPHA="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
function newCode(){const a=new Uint32Array(8);crypto.getRandomValues(a);return Array.from(a,x=>ALPHA[x%ALPHA.length]).join("")}
function view(n){$("login").hidden=n!=="login";$("setup").hidden=n!=="setup";$("app").hidden=n!=="app"}
function saveWho(n){try{localStorage.setItem("who",n)}catch(e){}}

function makeAdapter(hid){
  const H=doc(fs,"households",hid);
  return{
    collection:n=>({
      add:d=>addDoc(collection(H,n),d),
      onSnapshot:(f,e)=>onSnapshot(collection(H,n),s=>f({docs:s.docs}),e),
      get:()=>getDocs(collection(H,n)).then(s=>({docs:s.docs}))}),
    doc:p=>{
      if(p==="meta/members")return{
        set:d=>updateDoc(H,{members:d.list}),
        onSnapshot:(f,e)=>onSnapshot(H,s=>f({exists:s.exists(),data:()=>({list:(s.data()||{}).members||[]})}),e)};
      return{delete:()=>deleteDoc(doc(H,"expenses",p.split("/")[1]))};
    }
  };
}

let started=false;
async function start(hid){
  DB=makeAdapter(hid);
  $("hcode").textContent=hid;
  view("app");
  if(started)return;started=true;
  DB.collection("expenses").onSnapshot(s=>{S.expenses=s.docs.map(d=>{const x=Object.assign({},d.data());x.id=d.id;return x});render()},fail);
  DB.doc("meta/members").onSnapshot(s=>{const d=s.exists?s.data():null;if(d&&d.list&&d.list.length)S.members=d.list;chips();render()},fail);
}
async function enter(u){
  const snap=await getDoc(doc(fs,"users",u.uid));
  if(snap.exists()&&snap.data().hid){await start(snap.data().hid);return}
  $("sname").value=(u.displayName||"").split(" ")[0];
  view("setup");
}

$("gl").onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(fail);
$("out").onclick=()=>signOut(auth).then(()=>location.reload());

$("mk").onclick=async()=>{
  const name=$("sname").value.trim();
  if(!name){$("smsg").textContent="اكتب اسمك الأول.";return}
  $("smsg").textContent="";
  const uid=auth.currentUser.uid;
  try{
    let hid;
    for(let i=0;i<5;i++){
      hid=newCode();
      try{await setDoc(doc(fs,"households",hid),{owner:uid,uids:[uid],members:[name]});break}
      catch(e){if(i===4)throw e}
    }
    await setDoc(doc(fs,"users",uid),{hid:hid});
    saveWho(name);
    await start(hid);
  }catch(e){fail(e)}
};

$("jn").onclick=async()=>{
  const name=$("sname").value.trim();
  const code=$("scode").value.replace(/\s/g,"").toUpperCase();
  if(!name){$("smsg").textContent="اكتب اسمك الأول.";return}
  if(code.length!==8){$("smsg").textContent="الكود لازم يكون 8 حروف وأرقام.";return}
  $("smsg").textContent="";
  const uid=auth.currentUser.uid,H=doc(fs,"households",code);
  try{
    await updateDoc(H,{uids:arrayUnion(uid)});
    await updateDoc(H,{members:arrayUnion(name)});
    await setDoc(doc(fs,"users",uid),{hid:code});
    saveWho(name);
    await start(code);
  }catch(e){
    $("smsg").textContent=(e.code==="not-found"||e.code==="permission-denied")?"الكود ده مش صح.":"تعذّر الانضمام، جرّب تاني.";
  }
};

onAuthStateChanged(auth,u=>{
  if(!u){DB=null;view("login");return}
  enter(u).catch(fail);
});
</script>
</body>
</html>
